<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butterfly 🦋 Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Iconify Framework -->
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    :root {
      --bg: #090714;
      --card: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
      --purple: #8b5cf6;
      --purple-dark: #6d28d9;
      --green: #10b981;
      --red: #ef4444;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Smartphone Frame Mockup */
    .phone-container {
      width: 380px;
      height: 740px;
      background: #120e26;
      border: 8px solid #231e42;
      border-radius: 44px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(139, 92, 246, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Notch */
    .notch {
      width: 140px;
      height: 24px;
      background: #231e42;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      border-bottom-left-radius: 16px;
      border-bottom-right-radius: 16px;
      z-index: 100;
    }

    /* Mobile Header */
    .header {
      padding: 40px 24px 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      background: rgba(18, 14, 38, 0.8);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #c4b5fd;
    }

    .status-tag {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-tag.unpaired {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* Scrollable Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Pairing Form */
    .pair-input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--purple);
    }

    .btn {
      background: linear-gradient(135deg, var(--purple), var(--purple-dark));
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.9;
    }

    /* App Privacy List */
    .app-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .app-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      padding: 12px 14px;
      border-radius: 14px;
      transition: all 0.2s;
    }

    .app-item:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .app-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-icon {
      font-size: 24px;
      display: flex;
      align-items: center;
    }

    .app-name {
      font-size: 14px;
      font-weight: 600;
    }

    .app-pkg {
      font-size: 11px;
      color: var(--muted);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #374151;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--purple);
    }

    input:checked + .slider:before {
      transform: translateX(20px);
    }

    /* Foreground Activity Simulator */
    .active-badge {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .active-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <!-- Phone Notch -->
    <div class="notch"></div>

    <!-- App Header -->
    <div class="header">
      <div class="brand">
        <iconify-icon icon="lucide:butterfly" width="24"></iconify-icon>
        Butterfly Mobile
      </div>
      <div class="status-tag unpaired" id="statusTag">UNPAIRED</div>
    </div>

    <!-- Scroll Content -->
    <div class="content">

      <!-- Pairing Section -->
      <div class="card">
        <div class="card-header">
          <iconify-icon icon="heroicons:qr-code" width="18"></iconify-icon>
          Pair with Desktop App
        </div>
        <div class="pair-input-group">
          <input type="text" id="codeInput" placeholder="BFLY-1234" value="BFLY-">
          <button class="btn" onclick="pairWithCode()">Pair</button>
        </div>
      </div>

      <!-- Active Foreground App Simulation -->
      <div class="card">
        <div class="card-header">
          <iconify-icon icon="heroicons:device-phone-mobile" width="18"></iconify-icon>
          Foreground Tracker (Tap to Simulate)
        </div>

        <div class="active-badge" id="activeAppBadge">
          <div class="active-info">
            <iconify-icon id="currentAppIcon" icon="heroicons:device-phone-mobile" width="24" style="color: var(--purple);"></iconify-icon>
            <div>
              <div id="currentAppName" style="font-weight: 700; font-size: 15px;">Phone Lock Screen</div>
              <div id="currentAppSub" style="font-size: 12px; color: var(--muted);">Tap an app below to test tracking</div>
            </div>
          </div>
        </div>
      </div>

      <!-- App Privacy Controls (Whitelist / Blacklist) -->
      <div class="card">
        <div class="card-header">
          <iconify-icon icon="heroicons:shield-check" width="18"></iconify-icon>
          App Privacy Rules (Iconify)
        </div>

        <div class="app-list" id="appList">
          <!-- Apps dynamically generated -->
        </div>
      </div>

    </div>
  </div>

  <script>
    const SERVER_URL = 'https://butterfly-2dyb.onrender.com';
    let deviceToken = null;
    let pairingId = null;

    // Installed apps database with Iconify icons
    const apps = [
      { name: 'YouTube', pkg: 'com.google.android.youtube', icon: 'logos:youtube-icon', allowed: true },
      { name: 'Spotify', pkg: 'com.spotify.music', icon: 'logos:spotify-icon', allowed: true },
      { name: 'Instagram', pkg: 'com.instagram.android', icon: 'logos:instagram-icon', allowed: true },
      { name: 'Netflix', pkg: 'com.netflix.mediaclient', icon: 'logos:netflix-icon', allowed: true },
      { name: 'Twitch', pkg: 'tv.twitch.android.app', icon: 'logos:twitch', allowed: true },
      { name: 'Reddit', pkg: 'com.reddit.frontpage', icon: 'logos:reddit-icon', allowed: true },
      { name: 'WhatsApp (Private)', pkg: 'com.whatsapp', icon: 'logos:whatsapp-icon', allowed: false },
      { name: 'Duolingo', pkg: 'com.duolingo', icon: 'logos:duolingo-icon', allowed: true },
    ];

    function renderApps() {
      const container = document.getElementById('appList');
      container.innerHTML = apps.map(app => `
        <div class="app-item" onclick="openApp('${app.pkg}', '${app.name}')">
          <div class="app-info">
            <span class="app-icon"><iconify-icon icon="${app.icon}" width="24"></iconify-icon></span>
            <div>
              <div class="app-name">${app.name}</div>
              <div class="app-pkg">${app.pkg}</div>
            </div>
          </div>
          <label class="switch" onclick="event.stopPropagation()">
            <input type="checkbox" ${app.allowed ? 'checked' : ''} onchange="togglePrivacy('${app.pkg}', this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      `).join('');
    }

    async function pairWithCode() {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) return alert('Please enter a 6-digit code');

      try {
        const res = await fetch(`${SERVER_URL}/api/pair/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();

        if (data.success) {
          deviceToken = data.deviceToken;
          pairingId = data.pairingId;

          const tag = document.getElementById('statusTag');
          tag.innerText = 'PAIRED';
          tag.className = 'status-tag';
          alert('Butterfly Mobile paired successfully!');
        } else {
          alert('Pairing failed: ' + data.error);
        }
      } catch (err) {
        alert('Server unreachable');
      }
    }

    async function togglePrivacy(pkg, allowed) {
      const app = apps.find(a => a.pkg === pkg);
      if (app) app.allowed = allowed;

      if (deviceToken) {
        const excludedApps = apps.filter(a => !a.allowed).map(a => a.pkg);
        await fetch(`${SERVER_URL}/api/privacy/settings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ deviceToken, excludedApps }),
        });
      }
    }

    async function openApp(pkg, name) {
      const app = apps.find(a => a.pkg === pkg);
      
      document.getElementById('currentAppName').innerText = name;
      document.getElementById('currentAppSub').innerText = app.allowed ? 'Broadcasting live to Discord' : '🔒 Blacklisted (Hidden from Discord)';
      document.getElementById('currentAppIcon').setAttribute('icon', app.icon);

      if (!deviceToken) return;

      // Send activity to Cloud Server
      await fetch(`${SERVER_URL}/api/activity`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          deviceToken,
          packageName: pkg,
          appName: name,
        }),
      });
    }

    window.onload = renderApps;
  </script>
</body>
</html>
